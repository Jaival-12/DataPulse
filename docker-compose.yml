services:
  api:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATAPULSE_INTERNAL_TOKEN: ${DATAPULSE_INTERNAL_TOKEN:-}
      AIRFLOW_SCHEDULES_DIR: /app/airflow_dags/schedules
    volumes:
      - ./backend/storage:/app/storage
      - ./airflow/dags:/app/airflow_dags
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - datapulse
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - datapulse

networks:
  datapulse:
    name: datapulse-local
    driver: bridge

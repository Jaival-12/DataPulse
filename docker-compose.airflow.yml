services:
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in root .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airflow_private
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.11.2
    environment: &airflow-environment
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in root .env}
      AIRFLOW__CORE__PARALLELISM: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in root .env}@airflow-db/airflow
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Set AIRFLOW_WEBSERVER_SECRET_KEY in root .env}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-datapulse-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in root .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@localhost}
      DATAPULSE_AIRFLOW_SCHEDULES_DIR: /opt/airflow/dags/schedules
      DATAPULSE_API_URL: http://api:8000/api
      DATAPULSE_INTERNAL_TOKEN: ${DATAPULSE_INTERNAL_TOKEN:?Set DATAPULSE_INTERNAL_TOKEN in root .env}
      DATAPULSE_HTTP_TIMEOUT_SECONDS: ${DATAPULSE_HTTP_TIMEOUT_SECONDS:-15}
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/config:/opt/airflow/config:ro
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users list | grep -F "$${AIRFLOW_ADMIN_USERNAME}" >/dev/null ||
        airflow users create --username "$${AIRFLOW_ADMIN_USERNAME}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname DataPulse --lastname Admin --role Admin --email "$${AIRFLOW_ADMIN_EMAIL}")
    depends_on:
      airflow-db:
        condition: service_healthy
    networks:
      - airflow_private
    restart: "no"

  airflow-webserver:
    image: apache/airflow:2.11.2
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - airflow_private
      - datapulse_shared
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.11.2
    environment:
      <<: *airflow-environment
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
    volumes: *airflow-volumes
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - airflow_private
      - datapulse_shared
    restart: unless-stopped

volumes:
  airflow_metadata:
  airflow_logs:

networks:
  airflow_private:
    internal: true
  datapulse_shared:
    external: true
    name: datapulse-local
